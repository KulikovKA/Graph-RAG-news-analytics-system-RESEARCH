[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "small-classifier-graph"
version = "0.1.0"
description = "C-001: CPU scientific graph extraction without generative models"
requires-python = ">=3.11,<3.12"
dependencies = [
  "gliner==0.2.26",
  "torch==2.11.0",
  "transformers==4.51.3",
  "huggingface-hub==0.36.0",
  "scikit-learn==1.8.0",
  "numpy==2.4.1",
  "psutil==7.2.2",
  "safetensors==0.7.0",
  "tokenizers==0.21.4",
  "jsonschema==4.25.1",
  "glirel==1.0.1",
  "loguru==0.7.3",
  "flair==0.14.0",
]

[project.optional-dependencies]
test = ["pytest==8.3.5"]

[project.scripts]
cgraph = "cgraph.cli:main"
cgraph-zero = "cgraph.zeroshot_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-m 'not historical_training'"
markers = ["historical_training: preserved C-001 supervised fitting test; excluded from the no-training protocol"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
