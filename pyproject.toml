[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "small-classifier-graph"
version = "0.1.0"
description = "C-001: CPU scientific graph extraction without generative models"
requires-python = ">=3.11,<3.12"
dependencies = [
  "gliner==0.2.26",
  "torch==2.11.0",
  "transformers==5.1.0",
  "huggingface-hub==1.28.0",
  "scikit-learn==1.8.0",
  "numpy==2.4.1",
  "psutil==7.2.2",
  "safetensors==0.7.0",
  "tokenizers==0.22.2",
  "jsonschema==4.25.1",
]

[project.optional-dependencies]
test = ["pytest==8.3.5"]
# Retain the historical benchmark extra already present in the original uv.lock.
benchmark = ["gliner2[local]==2.1.0"]
ner-v2 = [
  "spacy==3.8.18",
  "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
  "requests==2.34.2",
  "sentencepiece==0.2.2",
  "tqdm==4.70.1",
]

[project.scripts]
cgraph = "cgraph.cli:main"
ner-v2 = "cgraph.ner_v2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
